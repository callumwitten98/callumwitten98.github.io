name: Copy research images from the old Wix site

# One-off: downloads the paper images from the old Wix research page, resizes
# them for the web and saves them to assets/img/research/. Safe to delete once it has run.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-research-images.yml"

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download and resize images
        run: |
          pip install pillow
          python - <<'EOF'
          import io, os, urllib.request
          from PIL import Image

          base = "https://static.wixstatic.com/media/"
          images = {
              "too-many-protoclusters": "46b2c2_e4ca937000914459a8b6c2000a8f6ab7~mv2.png",
              "not-all-protoclusters": "46b2c2_9286a150e2bd4e059bf3e20251baada7~mv2.png",
              "before-its-time": "46b2c2_d507edae555946e8b24c6a48ab92eda7~mv2.png",
              "rising-from-the-ashes": "46b2c2_0177c63124f0482c9edef513387372b6~mv2.png",
              "deciphering-lyman-alpha": "46b2c2_2a0b903e2b764f29b7b39807aca6d512~mv2.jpg",
              "gn-z11-environment": "46b2c2_efd98c52a3584edd816eae981c103865~mv2.png",
              "low-lyc-escape-fraction": "46b2c2_7ca5c0724ee64f22a7d8fc151bc6c939~mv2.jpg",
          }
          os.makedirs("assets/img/research", exist_ok=True)
          for name, media in images.items():
              req = urllib.request.Request(base + media, headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=60).read()
              img = Image.open(io.BytesIO(data))
              if img.mode in ("RGBA", "LA", "P"):
                  img = img.convert("RGBA")
                  background = Image.new("RGB", img.size, (255, 255, 255))
                  background.paste(img, mask=img.split()[-1])
                  img = background
              else:
                  img = img.convert("RGB")
              print(name, "original", img.size)
              img.thumbnail((1000, 1000), Image.LANCZOS)
              img.save("assets/img/research/%s.jpg" % name, "JPEG", quality=86, optimize=True, progressive=True)
              print(name, "saved", img.size, os.path.getsize("assets/img/research/%s.jpg" % name), "bytes")
          EOF

      - name: Save images and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/research
          git commit -m "Add research images from the old Wix site"
          git pull --rebase origin main
          git push
          gh workflow run deploy.yml --ref main
